name: PodBrief
options:
  bundleIdPrefix: com.podbriefapp
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""

targets:
  PodBrief:
    type: application
    platform: iOS
    sources:
      - PodBrief
    settings:
      base:
        INFOPLIST_FILE: PodBrief/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.podbriefapp.PodBrief
        CODE_SIGN_ENTITLEMENTS: PodBrief/PodBrief.entitlements
    entitlements:
      path: PodBrief/PodBrief.entitlements
      properties:
        com.apple.developer.associated-domains:
          - "applinks:podbriefapp.com"
